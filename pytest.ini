[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    service: HTTP checks against the mine's web service and front end (no browser)
    browser: Playwright checks of BlueGenes pages in a real browser
    external: depends on a third-party service (RCSB, ...) rather than on the mine
    patched: checks local patches to BlueGenes tool bundles (docker_template deployments)
